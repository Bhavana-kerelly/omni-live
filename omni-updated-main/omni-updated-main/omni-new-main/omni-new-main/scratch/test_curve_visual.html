<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Curve Test</title>
  <style>
    body { margin: 40px; background: #0b1528; }
    .header-top-banner {
      display: flex;
      align-items: stretch;
      height: 120px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(90deg, #0056b3 0%, #0077c8 22%, #009db5 52%, #38a826 84%, #56b92a 100%);
      box-shadow: 0 12px 35px rgba(0, 30, 70, 0.25);
    }
    .banner-logo-zone {
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 0 10px 0 36px;
      flex-shrink: 0;
    }
    .banner-logo-zone img {
      height: 60px;
    }
    .banner-curve-divider {
      width: 100px;
      height: 100%;
      flex-shrink: 0;
      margin-left: -1px;
    }
    .curve-swoosh-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-top-banner">
    <div class="banner-logo-zone">
      <img src="../public/omni-logo.png" alt="OMNI" />
    </div>
    <div class="banner-curve-divider">
      <svg viewBox="0 0 100 120" preserveAspectRatio="none" class="curve-swoosh-svg">
        <path d="M 0,0 L 55,0 C 90,20 100,55 65,95 C 48,115 15,120 0,120 Z" fill="#FFFFFF" />
        <path d="M 55,0 C 90,20 100,55 65,95 C 48,115 15,120 0,120" fill="none" stroke="#00A3FF" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 60,0 C 95,22 105,58 70,98 C 52,118 19,120 0,120" fill="none" stroke="#70BE44" stroke-width="4.5" stroke-linecap="round" />
      </svg>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:flex-end; padding-right:24px; color:#fff; font-family:sans-serif; font-size:20px;">
      Action panel area
    </div>
  </div>
</body>
</html>
